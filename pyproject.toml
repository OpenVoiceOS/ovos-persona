[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-persona"
dynamic = ["version"]
description = "persona pipeline for ovos"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [
    { name = "JarbasAI", email = "jarbasai@mailfence.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ovos-plugin-manager>=0.8.3,<3.0.0",
    "ovos-openai-plugin>=2.0.0,<3.0.0",
    "ovos-solver-failure-plugin",
    "ovos-utils>=0.8.0a1,<1.0.0",
    "langcodes",
    "ovos-workshop>=0.1.0,<9.0.0",
    "ovos-bus-client>=1.0.0,<3.0.0",
    "ovos-config>=0.0.13,<3.0.0",
    "pydantic",  # imported at runtime by ovos-plugin-manager agent_tools (only a test-extra there)
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "ovoscope",
    "ovos-solver-failure-plugin",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-persona"
Issues = "https://github.com/OpenVoiceOS/ovos-persona/issues"

[project.entry-points."opm.pipeline"]
ovos-persona-pipeline-plugin = "ovos_persona:PersonaService"

[project.entry-points."opm.agents.memory"]
ovos-agents-short-term-memory-plugin = "ovos_persona.memory:BasicShortTermMemory"

[tool.setuptools.dynamic]
version = { attr = "ovos_persona.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_persona*"]
